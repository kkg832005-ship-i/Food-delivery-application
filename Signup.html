<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    form {
        background: white;
        padding: 20px 30px;
        border-radius: 10px;
        width: 320px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    fieldset {
        border: none;
    }

    legend {
        font-size: 22px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 10px;
    }

    label {
        display: block;
        margin-top: 10px;
        font-size: 14px;
    }

    input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
    }

    input:focus {
        border-color: #007bff;
    }

    button {
        width: 48%;
        padding: 10px;
        margin-top: 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:first-of-type {
        background: #007bff;
        color: white;
    }

    button:last-of-type {
        background: #ccc;
    }

    button:hover {
        opacity: 0.9;
    }
</style>

<body>
    <form action="">

        <fieldset>
            <legend>Signup</legend>
            <label for="username">Enter USername:</label>
            <input type="text" id="username" placeholder="Enter username" name="username">
            <br><br>
            <label for="email">Enter Email:</label>
            <input type="email" id="email" placeholder="Enter email" name="email">
            <br><br>
            <label for="password">Enter Passowrd:</label>
            <input type="password" id="password" placeholder="Enter password" name="password">
            <br><br>
            <label for="age">Enter Age:</label>
            <input type="number" id="age" placeholder="Enter Age" name="age">
            <br><br>
            <label for="phNum">Enter Ph Number:</label>
             <input type="tel" minlength="10" maxlength="10" id="phNum" placeholder="Enter ph number" name="phNum">
            <br><br>
            <label for="dob">Enter DOB:</label>
             <input type="date" id="dob" placeholder="Enter DOB" name="dob">
            <br><br>
            <label for="imageUrl">Enter Image URL</label>
            <input type="url" placeholder="Enter Image URL" id="imageUrl" name="imageUrl">
            <br><br>
            <button>Submit</button>
            <button>Reset</button>

        </fieldset>
    </form>
</body>
<script src="./script/signup.js"></script>

</html>
